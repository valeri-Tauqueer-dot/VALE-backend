name: Collect news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the collector needs
        run: pip install sqlalchemy psycopg2-binary requests

      - name: Collect news
        run: python -m search_engine.collect_news
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SEARCH_DB_URL_1: ${{ secrets.SEARCH_DB_URL_1 }}
          SEARCH_DB_URL_2: ${{ secrets.SEARCH_DB_URL_2 }}
          SEARCH_DB_URL_3: ${{ secrets.SEARCH_DB_URL_3 }}
          SEARCH_DB_URL_4: ${{ secrets.SEARCH_DB_URL_4 }}
          SEARCH_DB_URL_5: ${{ secrets.SEARCH_DB_URL_5 }}
          SEARCH_DB_URL_6: ${{ secrets.SEARCH_DB_URL_6 }}
          SEARCH_DB_URL_7: ${{ secrets.SEARCH_DB_URL_7 }}
          SEARCH_DB_URL_8: ${{ secrets.SEARCH_DB_URL_8 }}
          SEARCH_DB_URL_9: ${{ secrets.SEARCH_DB_URL_9 }}
          SEARCH_DB_MAX_MB: ${{ vars.SEARCH_DB_MAX_MB || '400' }}
          SEARCH_DB_THRESHOLD_PERCENT: ${{ vars.SEARCH_DB_THRESHOLD_PERCENT || '80' }}
          
